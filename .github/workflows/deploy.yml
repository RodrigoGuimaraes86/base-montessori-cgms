name: Deploy site to GitHub Pages

# Publica o site estático no GitHub Pages a cada push na branch de trabalho.
# Requer (uma única vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches:
      - claude/montessori-website-redesign-od7n6h
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Permite uma execução concorrente por vez, sem cancelar deploys em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Reativa o Pages automaticamente se estiver desabilitado
          # (ex.: após o repositório ter ficado privado).
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publica a raiz do repositório (site estático, sem build).
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
